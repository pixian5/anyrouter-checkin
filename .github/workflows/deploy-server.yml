name: 部署 sf 服务器签到

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 部署服务器代码
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            deploy_path="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$deploy_path" ]; then
              deploy_path="/opt/anyrouter-checkin"
            fi
            test -f "$deploy_path/.env"
            test -x "$deploy_path/.venv/bin/python3"
            release_path="$(mktemp -d)"
            trap 'rm -rf "$release_path"' EXIT
            git clone --depth=1 --branch main https://github.com/pixian5/anyrouter-checkin.git "$release_path"
            rsync -a --delete "$release_path/" "$deploy_path/" \
              --exclude '.env' \
              --exclude '.env.before-*' \
              --exclude '.env.bak.*' \
              --exclude '.venv/' \
              --exclude 'balance_hash.txt' \
              --exclude 'daily_checkin_state.json' \
              --exclude '.browser_profiles/' \
              --exclude 'checkin_screenshots/' \
              --exclude '*.bak.*'
            "$deploy_path/.venv/bin/python3" -m py_compile "$deploy_path/checkin.py"
            "$deploy_path/.venv/bin/python3" -m compileall -q "$deploy_path/pixian_overlay"
            cd "$deploy_path"
            "$deploy_path/.venv/bin/python3" -c \
              "from pixian_overlay import app; from pixian_overlay.actual_checkin import install; install(app); assert app.run_check_in_requests._pixian_actual_checkin_overlay is True"
            /usr/local/bin/bz check -c /etc/bz/anyrouter-client.json
            install -d -m 0755 /etc/systemd/system/anyrouter-checkin.service.d
            install -m 0644 \
              "$deploy_path/deploy/systemd/anyrouter-checkin-overlay.conf" \
              /etc/systemd/system/anyrouter-checkin.service.d/overlay.conf
            systemctl daemon-reload
            systemctl restart anyrouter-vmess-client.service
            systemctl is-active --quiet anyrouter-vmess-client.service
            systemctl is-active --quiet anyrouter-checkin.timer
