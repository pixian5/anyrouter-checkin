name: 部署服务器签到

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 部署服务器代码
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            deploy_path="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$deploy_path" ]; then
              deploy_path="/home/x/fuwu/anyrouter-checkin"
            fi
            mkdir -p "$deploy_path"
            release_path="$(mktemp -d)"
            trap 'rm -rf "$release_path"' EXIT
            git clone --depth=1 --branch main https://github.com/pixian5/anyrouter-checkin.git "$release_path"
            rsync -a "$release_path/" "$deploy_path/" \
              --exclude '.env' \
              --exclude '.venv/' \
              --exclude 'balance_hash.txt' \
              --exclude 'daily_checkin_state.json' \
              --exclude '*.bak.*'
            test -x "$deploy_path/.venv/bin/python3"
            "$deploy_path/.venv/bin/python3" -m py_compile "$deploy_path/checkin.py"
            systemctl daemon-reload
            systemctl is-enabled --quiet anyrouter-vmess-client.service
            systemctl is-active --quiet anyrouter-vmess-client.service
            systemctl is-enabled --quiet anyrouter-checkin.timer
            systemctl restart anyrouter-vmess-client.service
            systemctl reset-failed anyrouter-checkin.service || true
            systemctl status anyrouter-vmess-client.service --no-pager -l
